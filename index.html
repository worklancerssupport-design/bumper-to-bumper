<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="index, follow" />

    <!-- Default SEO — overridden by React Helmet on each page -->
    <title>Bumper To Bumper Car Accessories Chennai | Adambakkam | Premium Automotive Studio</title>
    <meta name="description" content="Bumper To Bumper Car Accessories in Adambakkam, Chennai — 15+ years experience, 1000+ vehicles enhanced. Premium automotive accessories, interior & exterior customization, LED lighting, touchscreen infotainment, 360° cameras, and zero wire-cutting installation." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bumper To Bumper Car Accessories Chennai" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="/images/cars/jeep_compass.jpg" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Michroma (display) + Plus Jakarta Sans (body) typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent skip link from ever permanently occupying the page */
      .skip-link {
        position: absolute;
        top: 0;
        left: 0;
        transform: translateY(-200%);
        background: #D71920;
        color: #FFFFFF;
        padding: 0.6rem 1.2rem;
        z-index: 99999;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
        border-radius: 0 0 6px 0;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        transition: transform 0.15s ease-in-out;
      }
      .skip-link:focus {
        transform: translateY(0);
        outline: 3px solid #D71920;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
